<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trickopedia | The Body Movement Database</title>
  <meta name="description" content="Trickopedia is the ultimate body movement and moves database. Search, filter and submit moves.">
  <meta name="theme-color" content="#0b0d0f">
  <link rel="icon" href="assets/trickopedia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top">
    <div class="ticker" id="ticker"></div>
    <div class="top-inner">
      <a href="./" class="brand" aria-label="Trickopedia home">
        <img src="assets/trickopedia.png" alt="" class="brand-logo">
        <span class="brand-text">
          <span class="brand-name">Trickopedia</span>
          <span class="brand-tag">The ultimate body movement database</span>
        </span>
      </a>
      <nav class="top-nav" aria-label="Main">
        <a href="./" aria-current="page">Database</a>
        <a href="about.html">About</a>
        <a href="#" class="btn btn-red" data-submit-link>
          <span aria-hidden="true">+</span> <span class="btn-long">Submit a move</span><span class="btn-short">Submit</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="search" placeholder="Search moves: backflip, butterfly kick, windmill…" autocomplete="off" aria-label="Search the database">
      <kbd>/</kbd>
    </label>

    <div class="filters">
      <div class="chips" id="categoryChips" role="group" aria-label="Filter by category"></div>
      <label class="select">
        <span>Level</span>
        <select id="levelFilter" aria-label="Filter by level"></select>
      </label>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="foot">
    <p>© <span id="year"></span> Trickopedia</p>
    <nav class="foot-links"><a href="about.html">About</a><a href="#" data-submit-link>Submit a move</a></nav>
  </footer>

  <script src="app.js"></script>
</body>
</html>
