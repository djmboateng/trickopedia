<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trickopedia | The Body Movement Database</title>
  <meta name="description" content="Trickopedia is the ultimate body movement and moves database. Search, filter and submit moves.">
  <meta name="theme-color" content="#0b0d0f">
  <link rel="icon" href="assets/trickopedia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top">
    <div class="ticker" id="ticker"></div>
    <div class="top-inner">
      <a href="./" class="brand" aria-label="Trickopedia home">
        <img src="assets/trickopedia.png" alt="" class="brand-logo">
        <span class="brand-text">
          <span class="brand-name">Trickopedia</span>
          <span class="brand-tag">The ultimate body movement database</span>
        </span>
      </a>
      <nav class="top-nav" aria-label="Main">
        <a href="./" aria-current="page">Database</a>
        <a href="about.html">About</a>
        <button type="button" class="btn btn-red" data-open-submit>
          <span aria-hidden="true">+</span> <span class="btn-long">Submit a move</span><span class="btn-short">Submit</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="search" placeholder="Search moves: backflip, butterfly kick, windmill…" autocomplete="off" aria-label="Search the database">
      <kbd>/</kbd>
    </label>

    <div class="filters">
      <div class="chips" id="categoryChips" role="group" aria-label="Filter by category"></div>
      <label class="select">
        <span>Level</span>
        <select id="levelFilter" aria-label="Filter by level"></select>
      </label>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="foot">
    <p>© <span id="year"></span> Trickopedia</p>
    <nav class="foot-links"><a href="about.html">About</a><button type="button" class="link" data-open-submit>Submit a move</button></nav>
  </footer>

  <!-- ============ SUBMIT FORM ============ -->
  <dialog class="modal" id="submitDialog" aria-labelledby="submitTitle">
    <form id="submitForm" novalidate>
      <div class="modal-head">
        <h2 id="submitTitle">Submit a move</h2>
        <button type="button" class="modal-close" data-close aria-label="Close">×</button>
      </div>

      <div class="modal-body" id="formFields">
        <p class="muted">Share a link to a clip. Every entry is reviewed before it goes live.</p>

        <label class="field">
          <span>Link to the clip <b>*</b></span>
          <input type="url" name="link" required placeholder="https://youtube.com/watch?v=…" maxlength="500">
          <small class="hint">YouTube, Instagram, TikTok or any public link.</small>
        </label>

        <label class="field">
          <span>Move name <b>*</b></span>
          <input type="text" name="name" required placeholder="e.g. Butterfly twist" maxlength="120">
        </label>

        <div class="field-row">
          <label class="field">
            <span>Category <b>*</b></span>
            <select name="category" required id="formCategory"></select>
          </label>
          <label class="field">
            <span>Level</span>
            <select name="level" id="formLevel"></select>
          </label>
        </div>

        <label class="field">
          <span>Who's in the clip / creator</span>
          <input type="text" name="credit" placeholder="@handle" maxlength="120">
        </label>

        <label class="field">
          <span>Notes</span>
          <textarea name="notes" rows="3" placeholder="Anything we should know?" maxlength="1000"></textarea>
        </label>

        <!-- Spam trap: hidden from people, bots tend to fill it -->
        <input type="text" name="website" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">

        <p class="form-error" id="formError" role="alert"></p>
      </div>

      <div class="modal-done" id="formDone" hidden>
        <img src="assets/trickopedia.png" alt="" class="done-logo">
        <h3>Thanks, it's in!</h3>
        <p class="muted">We'll review your move before it goes live.</p>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-red" id="sendBtn">Send for review</button>
        <button type="button" class="btn btn-ghost" id="againBtn" hidden>Submit another</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
